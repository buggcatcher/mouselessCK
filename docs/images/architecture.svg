<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="mouselessCK architecture: the compositor only sees virtual devices">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2da44e"/></marker>
  </defs>
  <rect width="980" height="600" rx="18" fill="#0d1117"/>
  <text x="30" y="42" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3">The compositor only ever sees virtual devices</text>
  <rect x="290" y="70" width="400" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="490.0" y="98" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Physical keyboards</text><text x="490.0" y="120" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">laptop keyboard · USB · Bluetooth · every interface</text><line x1="490" y1="140" x2="490" y2="186" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/><text x="502" y="168" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8b949e">evdev · exclusive grab (EVIOCGRAB)</text><rect x="150" y="190" width="680" height="190" rx="16" fill="#2f81f7" fill-opacity=".07" stroke="#2f81f7" stroke-width="2"/><text x="172" y="218" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#e6edf3">mouselessckd</text><text x="808" y="218" text-anchor="end" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8b949e">system service · user mouselessck · sandboxed</text><rect x="172" y="236" width="300" height="124" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="322.0" y="264" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Engine (pure state machine)</text><text x="322.0" y="286" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">Meta+M toggle · swallow stray keys</text><text x="322.0" y="304" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">release goes where press went</text><text x="322.0" y="322" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">Esc + chords pass through</text><rect x="508" y="236" width="300" height="124" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="658.0" y="264" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Motion</text><text x="658.0" y="286" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">100 Hz ramp · precision on Shift</text><text x="658.0" y="304" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">hi-res wheel (120 / notch)</text><text x="658.0" y="322" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">both axes</text><line x1="472" y1="298" x2="506" y2="298" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/><rect x="150" y="432" width="300" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="300.0" y="460" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Virtual keyboard clones</text><text x="300.0" y="482" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">one per interface · same name &amp; caps</text><rect x="530" y="432" width="300" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="680.0" y="460" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Virtual mouse</text><text x="680.0" y="482" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">uinput · buttons · REL · hi-res wheel</text><line x1="300" y1="380" x2="300" y2="430" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/><line x1="680" y1="380" x2="680" y2="430" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/><rect x="150" y="524" width="680" height="56" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="490.0" y="552" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">libinput → compositor → applications</text><line x1="300" y1="496" x2="300" y2="522" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/><line x1="680" y1="496" x2="680" y2="522" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/><rect x="18" y="236" width="112" height="124" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="74.0" y="264" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">systemd</text><text x="74.0" y="286" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">watchdog 5 s</text><text x="74.0" y="304" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">restart limit</text><text x="74.0" y="322" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">hardening</text><line x1="130" y1="298" x2="170" y2="298" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 5"/><rect x="850" y="236" width="112" height="124" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="906.0" y="264" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">indicator</text><text x="906.0" y="286" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">your session</text><text x="906.0" y="304" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">layer-shell</text><text x="906.0" y="322" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8b949e">icon overlay</text><line x1="830" y1="298" x2="848" y2="298" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/><text x="906" y="380" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8b949e">receives only on/off</text><path d="M150 260 C 110 260, 110 105, 288 105" fill="none" stroke="#2da44e" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ahg)"/><text x="52" y="160" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#2da44e">LEDs mirrored</text>
</svg>
